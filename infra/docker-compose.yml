# Môi trường dev: PostgreSQL, Redis, MinIO (S3-compatible, thay cho object storage tại VN)
name: nopi
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nopi
      POSTGRES_PASSWORD: nopi
      POSTGRES_DB: nopi
      TZ: Asia/Ho_Chi_Minh
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nopi"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    # MinIO (S3-compatible). Image minio/minio trên Docker Hub không còn kéo được,
    # nên dùng bản build của Chainguard (vẫn cập nhật theo bản phát hành MinIO).
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: nopi
      MINIO_ROOT_PASSWORD: nopi-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
